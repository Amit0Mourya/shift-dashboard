							<head></head><body><h2 class="sr-only">Live shift dashboard with yesterday-based WO and leave bucketing</h2>
<style>
*{box-sizing:border-box;margin:0;padding:0;}

/* ── Header ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:1rem 0 0.875rem;border-bottom:1px solid var(--color-border-tertiary);margin-bottom:1.25rem;}

/* ── Shift tab buttons ── */
.shift-tabs{display:flex;gap:6px;background:var(--color-background-secondary);padding:4px;border-radius:10px;border:1px solid var(--color-border-tertiary);}
.tab{
  padding:6px 18px;border-radius:7px;border:none;background:transparent;
  cursor:pointer;font-size:13px;font-weight:500;color:var(--color-text-secondary);
  transition:background 0.15s,color 0.15s,box-shadow 0.15s;
  display:flex;align-items:center;gap:5px;
}
.tab:hover:not(.active){background:var(--color-background-primary);color:var(--color-text-primary);}
.tab.active{
  background:var(--color-background-primary);color:var(--color-text-primary);
  box-shadow:0 1px 4px rgba(0,0,0,0.12);font-weight:600;
}

/* ── Refresh button ── */
.refresh-btn{
  font-size:12px;padding:6px 14px;border-radius:8px;
  border:1px solid var(--color-border-secondary);
  background:var(--color-background-secondary);
  cursor:pointer;color:var(--color-text-secondary);
  display:flex;align-items:center;gap:5px;font-weight:500;
  transition:background 0.15s,color 0.15s,box-shadow 0.15s;
}
.refresh-btn:hover{background:var(--color-background-primary);color:var(--color-text-primary);box-shadow:0 1px 4px rgba(0,0,0,0.1);}
.refresh-btn:active{transform:scale(0.97);}

/* ── Metric cards ── */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:1.25rem;}
.metric{
  background:var(--color-background-secondary);
  border-radius:12px;padding:1rem 1.1rem;
  border:1px solid var(--color-border-tertiary);
  position:relative;overflow:hidden;
}
.metric::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:3px 0 0 3px;background:var(--color-border-tertiary);}
.metric.success::before{background:var(--color-text-success);}
.metric.danger::before{background:var(--color-text-danger);}
.metric.warn::before{background:var(--color-text-warning);}
.metric-label{font-size:10px;color:var(--color-text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em;font-weight:600;}
.metric-value{font-size:28px;font-weight:700;color:var(--color-text-primary);line-height:1;}
.metric-sub{font-size:11px;color:var(--color-text-tertiary);margin-top:5px;}
.metric.success .metric-value{color:var(--color-text-success);}
.metric.danger .metric-value{color:var(--color-text-danger);}
.metric.warn .metric-value{color:var(--color-text-warning);}

/* ── Layout ── */
.two-col{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;}
.card{background:var(--color-background-primary);border:1px solid var(--color-border-tertiary);border-radius:12px;padding:1rem 1.25rem;}
.card-title{font-size:13px;font-weight:600;color:var(--color-text-primary);margin-bottom:0.875rem;display:flex;align-items:center;gap:6px;}

/* ── Analyst table ── */
.analyst-table{width:100%;border-collapse:collapse;}
.analyst-table th{font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--color-text-tertiary);font-weight:600;padding:0 8px 8px;text-align:left;border-bottom:1px solid var(--color-border-tertiary);}
.analyst-table th:last-child{text-align:right;}
.analyst-table td{padding:7px 8px;font-size:13px;color:var(--color-text-primary);border-bottom:0.5px solid var(--color-border-tertiary);}
.analyst-table tr:last-child td{border-bottom:none;}
.analyst-table tr:hover td{background:var(--color-background-secondary);}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;vertical-align:middle;margin-right:7px;}
.analyst-name-cell{display:flex;align-items:center;}
.task-badge{font-size:11px;padding:2px 8px;border-radius:6px;white-space:nowrap;font-weight:500;}
.poc-badge{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--color-background-warning);color:var(--color-text-warning);margin-left:5px;font-weight:600;}

/* ── Absent chips ── */
.wo-section{margin-top:0.875rem;padding-top:0.875rem;border-top:1px solid var(--color-border-tertiary);}
.wo-title{font-size:11px;color:var(--color-text-secondary);margin-bottom:7px;font-weight:600;display:flex;align-items:center;gap:5px;}
.wo-chips{display:flex;flex-wrap:wrap;gap:5px;}
.wo-chip{font-size:11px;padding:3px 9px;border-radius:6px;background:var(--color-background-warning);color:var(--color-text-warning);font-weight:500;}
.leave-chip{font-size:11px;padding:3px 9px;border-radius:6px;background:var(--color-background-danger);color:var(--color-text-danger);font-weight:500;}

/* ── Breakdown card ── */
.breakdown-list{display:flex;flex-direction:column;gap:5px;}
.breakdown-item{display:flex;align-items:center;gap:8px;padding:4px 0;}
.b-icon{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.b-name{font-size:12px;color:var(--color-text-primary);flex:1;}
.b-bar-wrap{width:44px;height:4px;background:var(--color-border-tertiary);border-radius:3px;overflow:hidden;}
.b-bar{height:100%;border-radius:3px;}
.b-count{font-size:12px;font-weight:600;color:var(--color-text-secondary);min-width:18px;text-align:right;}
.divider-row{font-size:10px;color:var(--color-text-tertiary);padding:6px 0 4px;border-top:1px solid var(--color-border-tertiary);margin:4px 0;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;}

/* ── Copy button ── */
.copy-btn{
  font-size:11px;padding:5px 10px;border-radius:7px;
  border:1px solid var(--color-border-secondary);
  background:var(--color-background-secondary);
  cursor:pointer;color:var(--color-text-secondary);
  display:flex;align-items:center;gap:4px;margin-left:auto;
  font-weight:500;transition:background 0.15s,color 0.15s,box-shadow 0.15s;
}
.copy-btn:hover{background:var(--color-background-primary);color:var(--color-text-primary);box-shadow:0 1px 4px rgba(0,0,0,0.1);}
.copy-btn:active{transform:scale(0.96);}
.copy-btn.copied{color:var(--color-text-success);border-color:var(--color-text-success);}

/* ── POC ── */
.poc-row{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--color-border-tertiary);margin-top:4px;}
.poc-label{font-size:12px;color:var(--color-text-secondary);}
.poc-name{font-size:13px;font-weight:600;color:var(--color-text-warning);}
.summary-rows{display:flex;flex-direction:column;gap:3px;padding:8px 0;border-top:1px solid var(--color-border-tertiary);margin-top:6px;}
.summary-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:2px 0;}
.summary-label{color:var(--color-text-secondary);display:flex;align-items:center;gap:4px;}
.summary-val{font-weight:600;color:var(--color-text-primary);}

/* ── Page nav tabs ── */
.page-tabs{display:flex;gap:4px;background:var(--color-background-secondary);padding:4px;border-radius:10px;border:1px solid var(--color-border-tertiary);}
.page-tab{padding:6px 14px;border-radius:7px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--color-text-secondary);transition:background 0.15s,color 0.15s,box-shadow 0.15s;display:flex;align-items:center;}
.page-tab:hover:not(.active){background:var(--color-background-primary);color:var(--color-text-primary);}
.page-tab.active{background:var(--color-background-primary);color:var(--color-text-primary);box-shadow:0 1px 4px rgba(0,0,0,0.12);font-weight:600;}

/* ── Links page ── */
.links-page{padding:4px 0;}
.links-section{margin-bottom:1.25rem;}
.links-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--color-text-tertiary);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.links-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;}
.link-card{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:10px;
  border:1px solid var(--color-border-tertiary);
  background:var(--color-background-primary);
  text-decoration:none;color:var(--color-text-primary);
  transition:background 0.15s,box-shadow 0.15s,transform 0.1s;
  cursor:pointer;
}
.link-card:hover{background:var(--color-background-secondary);box-shadow:0 2px 8px rgba(0,0,0,0.1);transform:translateY(-1px);}
.link-card:active{transform:scale(0.98);}
.link-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}
.link-info{min-width:0;}
.link-name{font-size:13px;font-weight:600;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.link-domain{font-size:11px;color:var(--color-text-tertiary);margin-top:1px;}

/* ── Credential reveal ── */
.cred-row{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid var(--color-border-tertiary);}
.cred-item{display:flex;align-items:center;gap:5px;flex:1;min-width:0;}
.cred-label{font-size:10px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;flex-shrink:0;}
.cred-val{font-size:12px;font-weight:600;color:var(--color-text-primary);filter:blur(5px);transition:filter 0.25s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;user-select:none;}
.cred-copy{font-size:10px;padding:2px 8px;border-radius:5px;border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);cursor:pointer;color:var(--color-text-secondary);opacity:0;transition:opacity 0.2s;white-space:nowrap;flex-shrink:0;pointer-events:none;}
.cred-copy.ok{color:var(--color-text-success);border-color:var(--color-text-success);}

/* Reveal on hover of the whole card */
.link-card.has-creds:hover .cred-val{filter:blur(0);user-select:text;}
.link-card.has-creds:hover .cred-copy{opacity:1;pointer-events:auto;}
.link-card.has-creds:hover .cred-copy:hover{background:var(--color-background-primary);color:var(--color-text-primary);}

.link-card.has-creds{align-items:flex-start;flex-direction:column;}
.link-card.has-creds .link-top{display:flex;align-items:center;gap:10px;width:100%;}

/* ── Misc ── */
.error-box{background:var(--color-background-danger);color:var(--color-text-danger);border-radius:10px;padding:0.75rem 1rem;font-size:13px;margin-bottom:1rem;}
.loading{text-align:center;padding:2rem;color:var(--color-text-secondary);font-size:14px;}
</style>

<div class="header">
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="page-tabs">
      <button class="page-tab active" onclick="setPage('dashboard')"><i class="ti ti-layout-dashboard" style="font-size:13px;margin-right:4px;vertical-align:-1px"></i>Dashboard</button>
      <button class="page-tab" onclick="setPage('links')"><i class="ti ti-link" style="font-size:13px;margin-right:4px;vertical-align:-1px"></i>Links</button>
    </div>
    <div class="shift-tabs" id="shift-tabs">

  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <span style="font-size:13px;color:var(--color-text-secondary);" id="date-label"></span>
    <button class="refresh-btn" id="refresh-btn" onclick="loadAll()"><i class="ti ti-refresh" aria-hidden="true" style="font-size:13px"></i>Refresh</button>
  </div>
</div>
<div id="error-area"></div>

const avatarColors=['#3266ad','#1d9e75','#d85a30','#993c1d','#534ab7','#d4537e','#3b6d11','#ba7517'];
const initials=n=>n.trim().split(' ').map(p=>p[0]).join('').toUpperCase().slice(0,2);
const fmt=n=>n%1===0?String(n):n.toFixed(1);

let currentShift='Morning';
let scAnalysts=[];      // all rows from Shift Count: {name, todayShift, homeShift, todayTask}
let bbYestMap={};       // name -> shift on yesterday from BB-SQUAD

function todayDateStr(){
  const d=new Date();
  return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`;
}

function yesterdayHeaderStr(){
  const d=new Date();
  d.setDate(d.getDate()-1);
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}`;
}

function setDateLabel(){
  const d=new Date();
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('date-label').textContent=`${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

async function fetchRange(tab,range){
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(tab+'!'+range)}?key=${API_KEY}`;
  const r=await fetch(url);
  const j=await r.json();
  if(j.error)throw new Error(j.error.message);
  return j.values||[];
}

async function loadAll(){
  document.getElementById('error-area').innerHTML='';
  document.getElementById('main-content').innerHTML='<div class="loading"><i class="ti ti-loader" style="font-size:20px"></i><br>Loading...</div>';
  try{
    const [scRows,bbRows]=await Promise.all([
      fetchRange('Shift Count','A1:Z60'),
      fetchRange('BB-SQUAD','A1:CZ30')
    ]);
    parseShiftCount(scRows);
    parseBBSquad(bbRows);
    render();
  }catch(e){showError('Error: '+e.message);}
}

function parseShiftCount(rows){
  scAnalysts=[];
  if(!rows.length)return;
  const headerRow=rows[1]||[];
  const today=todayDateStr();
  let todayCol=-1;
  for(let c=0;c<headerRow.length;c++){
    if((headerRow[c]||'').trim()===today){todayCol=c;break;}
  }
  for(let r=2;r<rows.length;r++){
    const row=rows[r]||[];
    const name=(row[0]||'').trim();
    if(!name)continue;
    const todayShift=(row[1]||'').trim();  // col B: today's shift value (Morning/Afternoon/Night/WO)
    const homeShift=(row[2]||'').trim();   // col C: analyst's regular/home shift (always Morning/Afternoon/Night)
    const todayTask=todayCol>=0?(row[todayCol]||'').trim():'';
    scAnalysts.push({name,todayShift,homeShift,todayTask});
  }
}

function parseBBSquad(rows){
  bbYestMap={};
  if(!rows.length)return;
  const headerRow=rows[0]||[];
  const yestStr=yesterdayHeaderStr();
  let yestCol=-1;
  for(let c=1;c<headerRow.length;c++){
    const cell=(headerRow[c]||'').trim();
    if(cell===yestStr){yestCol=c;break;}
  }
  if(yestCol<0){
    console.warn('Yesterday col not found in BB-SQUAD, tried:',yestStr);
    return;
  }
  for(let r=1;r<rows.length;r++){
    const row=rows[r]||[];
    const name=(row[0]||'').trim();
    if(!name)continue;
    const shift=(row[yestCol]||'').trim();
    if(shift) bbYestMap[name]=shift;
  }
}

function getPOC(shift,analysts){
  // Available = present in this shift and not absent (WO/leave/H/D)
  const available=new Set(
    analysts
      .filter(a=>!ABSENT_TASKS.includes(a.todayShift) && !ABSENT_TASKS.includes(a.todayTask))
      .map(a=>a.name)
  );
  // Walk priority list top-down; first one found in available set is POC
  for(const p of POC_PRIORITY){
    if(available.has(p)) return p;
  }
  return null;
}

function showError(msg){
  document.getElementById('error-area').innerHTML=`<div class="error-box"><i class="ti ti-alert-circle" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i>${msg}</div>`;
  document.getElementById('main-content').innerHTML='';
}

function setShift(s){
  currentShift=s;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['Morning','Afternoon','Night'][i]===s));
  render();
}

function copyBreakdown(){
  const el=document.getElementById('copy-source');
  if(!el)return;
  navigator.clipboard.writeText(el.innerText).then(()=>{
    const btn=document.getElementById('copy-btn');
    if(btn){
      btn.classList.add('copied');
      btn.innerHTML='<i class="ti ti-check" style="font-size:11px"></i> Copied';
      setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML='<i class="ti ti-copy" style="font-size:11px"></i> Copy';},2000);
    }
  });
}

function render(){
  // 1. Expected = analysts whose col B (todayShift) = currentShift (they are actually working today)
  const expected=scAnalysts.filter(a=>a.todayShift===currentShift);

  // 2. WO count: col B = 'WO' AND col C (homeShift) = currentShift
  const woList=scAnalysts.filter(a=>a.todayShift===WO && a.homeShift===currentShift);

  // 3. Leave count: col B != WO, col C = currentShift, todayTask is a leave type
  const leaveList=scAnalysts.filter(a=>LEAVE_TASKS.includes(a.todayTask) && a.homeShift===currentShift);

  // 4. H/D count: col C = currentShift, todayTask = H/D, counts 0.5
  const hdList=scAnalysts.filter(a=>a.todayTask===HD && a.homeShift===currentShift);

  const woCount=woList.length;
  const leaveCount=leaveList.length+(hdList.length*0.5);

  // 5. Present = expected analysts who are NOT absent
  let presentCount=0;
  expected.forEach(a=>{
    if(a.todayTask===HD) presentCount+=0.5;
    else if(!ABSENT_TASKS.includes(a.todayTask)) presentCount+=1;
  });

  const poc=getPOC(currentShift,expected);

  // Metrics
  const metricsHtml=`<div class="metrics">
    <div class="metric"><div class="metric-label">Expected</div><div class="metric-value">${expected.length}</div><div class="metric-sub">${currentShift} shift today</div></div>
    <div class="metric success"><div class="metric-label">Present</div><div class="metric-value">${fmt(presentCount)}</div><div class="metric-sub">H/D counts as 0.5</div></div>
    <div class="metric warn"><div class="metric-label">Week off</div><div class="metric-value">${woCount}</div><div class="metric-sub">${currentShift} shift analysts</div></div>
    <div class="metric danger"><div class="metric-label">On leave</div><div class="metric-value">${fmt(leaveCount)}</div><div class="metric-sub">${currentShift} shift analysts</div></div>
  </div>`;

  // Analyst table
  let analystHtml=`<div class="card">
    <div class="card-title"><i class="ti ti-users" aria-hidden="true"></i> ${currentShift} Shift Analysts</div>
    <table class="analyst-table">
      <thead><tr><th>#</th><th>Analyst</th><th style="text-align:right">Task</th></tr></thead>
      <tbody>`;

  expected.forEach((a,i)=>{
    const ac=avatarColors[i%avatarColors.length];
    const tm=taskMeta[a.todayTask]||{icon:'ti-minus',color:'#888780'};
    const isPOC=poc===a.name;
    analystHtml+=`<tr>
      <td style="color:var(--color-text-tertiary);font-size:11px;width:24px;">${i+1}</td>
      <td>
        <div class="analyst-name-cell">
          <div class="avatar" style="background:${ac}20;color:${ac}">${initials(a.name)}</div>
          <span>${a.name}${isPOC?'<span class="poc-badge">POC</span>':''}</span>
        </div>
      </td>
      <td style="text-align:right">
        <span class="task-badge" style="background:${tm.color}15;color:${tm.color};">
          ${tm.svg?`<img src="data:image/svg+xml;utf8,${encodeURIComponent(tm.svg)}" style="width:13px;height:13px;vertical-align:-2px;margin-right:4px;border-radius:3px;">`:`<i class="ti ${tm.icon||'ti-minus'}" aria-hidden="true" style="font-size:10px;vertical-align:-1px;margin-right:3px"></i>`}${a.todayTask||'—'}${a.todayTask===HD?' (0.5)':''}
        </span>
      </td>
    </tr>`;
  });

  if(!expected.length) analystHtml+=`<tr><td colspan="3" style="font-size:13px;color:var(--color-text-tertiary);padding:0.5rem 0;">No analysts found.</td></tr>`;
  analystHtml+=`</tbody></table>`;

  // Absent chips
  const allAbsentForShift=[...woList,...leaveList,...hdList];
  if(allAbsentForShift.length){
    analystHtml+=`<div class="wo-section">
      <div class="wo-title"><i class="ti ti-calendar-off" aria-hidden="true"></i>Absent this shift</div>
      <div class="wo-chips">`;
    woList.forEach(a=>{
      analystHtml+=`<span class="wo-chip">${a.name} · WO</span>`;
    });
    [...leaveList,...hdList].forEach(a=>{
      analystHtml+=`<span class="leave-chip">${a.name} · ${a.todayTask}</span>`;
    });
    analystHtml+=`</div></div>`;
  }
  analystHtml+=`</div>`;

  // Task breakdown from expected analysts
  const taskCounts={};
  expected.forEach(a=>{
    const t=a.todayTask||'Unassigned';
    taskCounts[t]=(taskCounts[t]||0)+(a.todayTask===HD?0.5:1);
  });
  const maxC=Math.max(...Object.values(taskCounts),1);

  const taskEmoji={
    'EYBL BB':'🏀','NCAA DIII BB':'🏀','Georgia BB':'🏀',
    'Flohockey HK':'🏑','Georgia HK':'🏑','NHL':'🏒',
    'Upload Sessions':'☁️','Video Upload':'🎬','Video upload':'🎬',
    'STA':'📊','Sheet Work':'📋','Queue Handling':'📥',
    'Source Finding':'🔍','N/A games check':'✅',
    'Training':'📚','Trainer':'🏆','Others':'📌',
    'WO':'🚫','Holiday':'🌴','H/D':'🏠',
    'Unplanned leave':'❌','Planned leave':'🗓️',
  };

  // Convert text to Unicode bold (renders everywhere incl. Slack paste)
  const bold=s=>s.replace(/[A-Za-z0-9]/g,c=>{
    const n=c.charCodeAt(0);
    if(n>=65&&n<=90) return String.fromCodePoint(0x1D400+n-65);
    if(n>=97&&n<=122) return String.fromCodePoint(0x1D41A+n-97);
    if(n>=48&&n<=57) return String.fromCodePoint(0x1D7CE+n-48);
    return c;
  });

  const shiftEmoji={'Morning':'🌅','Afternoon':'☀️','Night':'🌙'};
  const se=shiftEmoji[currentShift]||'';
  const d=new Date().toLocaleDateString('en-IN');
  let copyText='';
  copyText+=`${se} ${bold(currentShift+' Shift Count')} — ${d}\n`;
  copyText+=`━━━━━━━━━━━━━━━━━━━━\n`;
  copyText+=`👤 POC: ${bold(poc||'—')}\n`;
  copyText+=`━━━━━━━━━━━━━━━━━━━━\n`;
  copyText+=`👥 Expected: ${bold(String(expected.length))}\n`;
  copyText+=`✅ Present: ${bold(fmt(presentCount))}\n`;
  copyText+=`🚫 Week Off: ${bold(String(woCount))}\n`;
  copyText+=`❌ On Leave: ${bold(fmt(leaveCount))}\n`;
  copyText+=`━━━━━━━━━━━━━━━━━━━━\n`;
  copyText+=`📋 ${bold('Task Breakdown')}\n`;
  Object.entries(taskCounts).sort((a,b)=>b[1]-a[1]).forEach(([t,c])=>{
    copyText+=`${taskEmoji[t]||'▪️'} ${t}: ${bold(fmt(c))}\n`;

  let breakdownHtml=`<div class="card">
    <div class="card-title" style="justify-content:space-between;">
      <span><i class="ti ti-list-check" aria-hidden="true"></i> Shift count for ${currentShift} shift</span>
      <button class="copy-btn" id="copy-btn" onclick="copyBreakdown()"><i class="ti ti-copy" style="font-size:11px"></i> Copy</button>

    <div id="copy-source" style="display:none;">${copyText}</div>

      <span class="poc-label">POC :</span><span class="poc-name">${poc}</span>
    </div>`;
  }

  breakdownHtml+=`<div class="summary-rows">
    <div class="summary-row"><span class="summary-label"><i class="ti ti-users" aria-hidden="true" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>Total expected</span><span class="summary-val">${expected.length}</span></div>
    <div class="summary-row"><span class="summary-label"><i class="ti ti-user-check" aria-hidden="true" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>Present</span><span class="summary-val" style="color:var(--color-text-success)">${fmt(presentCount)}</span></div>
    <div class="summary-row"><span class="summary-label"><i class="ti ti-calendar-off" aria-hidden="true" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>Week off</span><span class="summary-val">${woCount}</span></div>
    <div class="summary-row"><span class="summary-label"><i class="ti ti-user-off" aria-hidden="true" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>On leave</span><span class="summary-val">${fmt(leaveCount)}</span></div>
  </div>
  <div class="divider-row">Tasks</div>`;

  Object.entries(taskCounts).sort((a,b)=>b[1]-a[1]).forEach(([t,c])=>{
    const tm=taskMeta[t]||{icon:'ti-minus',color:'#888780'};
    const pct=Math.round((c/maxC)*100);
    breakdownHtml+=`<div class="breakdown-item">
      <div class="b-icon" style="background:${tm.color}18;overflow:hidden;padding:${tm.svg?'2px':'0'}">
        ${tm.svg?`<img src="data:image/svg+xml;utf8,${encodeURIComponent(tm.svg)}" style="width:100%;height:100%;border-radius:4px;">`:`<i class="ti ${tm.icon||'ti-minus'}" aria-hidden="true" style="color:${tm.color};font-size:12px"></i>`}
      </div>
      <span class="b-name">${t}</span>
      <div class="b-bar-wrap"><div class="b-bar" style="width:${pct}%;background:${tm.color}"></div></div>
      <span class="b-count">${fmt(c)}</span>
    </div>`;
  });

  if(!Object.keys(taskCounts).length) breakdownHtml+=`<div style="font-size:13px;color:var(--color-text-tertiary);">No tasks assigned.</div>`;
  breakdownHtml+=`</div></div>`;

  document.getElementById('main-content').innerHTML=metricsHtml+`<div class="two-col">${analystHtml}${breakdownHtml}</div>`;
}

function setPage(page){
  document.querySelectorAll('.page-tab').forEach(b=>b.classList.toggle('active',b.textContent.trim().toLowerCase().includes(page==='dashboard'?'dashboard':'link')));
  const isDash=page==='dashboard';
  document.getElementById('main-content').style.display=isDash?'':'none';
  document.getElementById('error-area').style.display=isDash?'':'none';
  document.getElementById('links-content').style.display=isDash?'none':'';
  document.getElementById('shift-tabs').style.display=isDash?'':'none';

}

  // Attach copy listeners after DOM is set
  document.querySelectorAll('.cred-copy').forEach(btn=>{
    btn.addEventListener('click',function(e){
      e.preventDefault();
      e.stopPropagation();
      const text=this.dataset.copy;
      navigator.clipboard.writeText(text).then(()=>{
        this.textContent='✓';
        this.classList.add('ok');
        setTimeout(()=>{this.textContent='Copy';this.classList.remove('ok');},1500);
      }).catch(()=>{
        // Fallback for browsers that block clipboard
        const ta=document.createElement('textarea');
        ta.value=text;
        ta.style.position='fixed';ta.style.opacity='0';
        document.body.appendChild(ta);ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        this.textContent='✓';this.classList.add('ok');

      });
